                    <p>But Natalie feels she committed 'career-suicide' by opting to getting married and have a child at twenty-five. 'My colleagues seemed utterly mystified and tried to talk me out of it.' And on her return to work Natalie felt instant resentment towards her. 'I had to leave promptly at the end of the working day to take care of my daughter Anita but would come in an hour early and work through my lunch hour. It made no difference,' she explains. 'They simply alienated me.' By this she means that workmates were reluctant to update her on recent developments and withheld vital information on new projects.</p>

            <div style="background:#fafafa;padding:20px;border-radius:10px;text-align:center;margin-top:16px;">
                <p style="margin:0;color:#666;font-style:italic;font-size:15px;">"It's not the load that breaks you down, it's the way you carry it."</p>
                <p style="margin:8px 0 0 0;color:#999;font-size:12px;">— Lou Holtz</p>
            </div>
        `
    }
];

let current = 0;

function render() {
    document.getElementById('content').innerHTML = `<h2 class="slide-title">${slides[current].title}</h2>${slides[current].html}`;
    document.getElementById('counter').textContent = `${current + 1} / ${slides.length}`;
    document.getElementById('btnPrev').disabled = current === 0;
    document.getElementById('btnNext').disabled = current === slides.length - 1;
    
    const dots = document.getElementById('dots');
    dots.innerHTML = slides.map((_, i) => 
        `<div class="dot ${i === current ? 'active' : ''}" onclick="goTo(${i})"></div>`
    ).join('');
}

function nextSlide() { if (current < slides.length - 1) { current++; render(); } }
function prevSlide() { if (current > 0) { current--; render(); } }
function goTo(i) { current = i; render(); }

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
});

render();
</script>

</body>
</html>
